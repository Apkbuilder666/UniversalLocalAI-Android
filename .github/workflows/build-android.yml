name: Build Android arm64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc spirv-headers libvulkan-dev
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
      - name: Verify bundled Android runtimes
        working-directory: third_party/android
        run: sha256sum --check SHA256SUMS
      - name: Verify Android Vulkan build headers
        run: |
          test -f /usr/include/vulkan/vulkan.hpp
          test -f /usr/include/vk_video/vulkan_video_codec_h264std.h
          test -f /usr/include/spirv/unified1/spirv.hpp
      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DSPIRV-Headers_DIR=/usr/share/cmake/SPIRV-Headers \
            -DLOCALAI_BUILD_GUI=ON \
            -DLOCALAI_BUILD_CLI=OFF \
            -DLOCALAI_BUILD_TESTS=OFF \
            -DLOCALAI_ENABLE_LLAMA=ON \
            -DLOCALAI_ENABLE_ONNX=ON \
            -DLOCALAI_ENABLE_LITERT=ON \
            -DLOCALAI_ENABLE_IMAGE_GENERATION=ON \
            -DLOCALAI_ENABLE_WHISPER=ON \
            -DLOCALAI_ENABLE_TTS=ON \
            -DLOCALAI_ENABLE_VULKAN=ON \
            -DLOCALAI_ENABLE_CUDA=OFF \
            -DLOCALAI_ENABLE_HIP=OFF \
            -DLOCALAI_ENABLE_METAL=OFF \
            -DLOCALAI_ENABLE_LIBTORCH=OFF \
            -DLOCALAI_ENABLE_OPENVINO=OFF
      - name: Build APK
        run: cmake --build build-android --target apk --parallel 2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-local-ai-android-arm64
          path: build-android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
