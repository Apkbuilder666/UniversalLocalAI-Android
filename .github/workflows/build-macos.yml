name: Build macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            architecture: x86_64
          - runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
          -DLOCALAI_ENABLE_LLAMA=ON
          -DLOCALAI_ENABLE_IMAGE_GENERATION=ON
          -DLOCALAI_ENABLE_WHISPER=ON
          -DLOCALAI_ENABLE_TTS=OFF
          -DLOCALAI_ENABLE_METAL=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Install and deploy Qt
        run: |
          cmake --install build --prefix dist
          macdeployqt "dist/localai-desktop.app" -always-overwrite
          ditto -c -k --sequesterRsrc --keepParent dist UniversalLocalAI-macos-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalLocalAI-macos-${{ matrix.architecture }}
          path: UniversalLocalAI-macos-${{ matrix.architecture }}.zip
